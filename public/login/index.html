<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="robots" content="noindex" />
  <title>Kiosk Login — Document Dash</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔒</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400..800&display=swap" rel="stylesheet">
  <!--
    Kiosk login. Self-contained on purpose: nginx serves this page to everyone, while the game
    and its files under /document_dash/ need the kiosk cookie this login grants (see
    deploy/nginx/document_dash.conf.template). Paths are relative so the page works under any base path.
  -->
  <style>
    :root {
      --blue-600: #0070f3;
      --cyan-400: #00d2ff;
      --ink-950: #0b192c;
      --ink-600: #475569;
      --ink-300: #cbd5e1;
      --ink-100: #f1f5f9;
      --rose-600: #e11d48;
      --rose-50: #fff1f2;
      --green-600: #00a843;
      --emerald-50: #ecfdf5;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      touch-action: pan-x pan-y;
      overscroll-behavior: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
      color: var(--ink-950);
      background: radial-gradient(circle at 50% 25%, #ffffff 0%, #f0f7ff 55%, #e0f2fe 100%);
    }

    .card {
      width: min(440px, 100%);
      padding: 32px;
      border-radius: 24px;
      background: #ffffff;
      border: 1.5px solid rgba(0, 132, 255, 0.18);
      box-shadow: 0 24px 56px rgba(11, 25, 44, 0.14);
    }

    .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }

    .logo {
      display: grid;
      place-items: center;
      width: 48px;
      height: 48px;
      border-radius: 16px;
      background: linear-gradient(135deg, var(--blue-600), var(--cyan-400));
      color: #ffffff;
      box-shadow: 0 6px 16px rgba(0, 132, 255, 0.35);
    }

    .brand h1 { font-size: 22px; font-weight: 800; }
    .brand p { font-size: 14px; font-weight: 600; color: var(--ink-600); }

    label { display: block; margin: 16px 0 6px; font-size: 14px; font-weight: 700; }

    input {
      width: 100%;
      height: 56px;
      padding: 0 16px;
      border: 2px solid var(--ink-300);
      border-radius: 14px;
      font: inherit;
      font-size: 18px;
      font-weight: 600;
      color: var(--ink-950);
      background: #ffffff;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input:focus { border-color: var(--blue-600); box-shadow: 0 0 0 4px rgba(0, 112, 243, 0.15); }

    button {
      width: 100%;
      height: 60px;
      margin-top: 24px;
      border: none;
      border-radius: 999px;
      font: inherit;
      font-size: 18px;
      font-weight: 800;
      color: #ffffff;
      background: linear-gradient(135deg, var(--blue-600), var(--cyan-400));
      box-shadow: 0 10px 24px rgba(0, 112, 243, 0.3);
      cursor: pointer;
      touch-action: manipulation;
    }

    button:disabled { opacity: 0.6; cursor: wait; }

    .message {
      display: none;
      margin-top: 16px;
      padding: 12px 14px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      line-height: 1.4;
    }

    .message.is-error { display: block; color: var(--rose-600); background: var(--rose-50); }
    .message.is-info { display: block; color: var(--ink-600); background: var(--ink-100); }
    .message.is-success { display: block; color: var(--green-600); background: var(--emerald-50); }

    .note { margin-top: 20px; font-size: 13px; font-weight: 500; line-height: 1.45; color: var(--ink-600); text-align: center; }
  </style>
</head>
<body>
  <main class="card">
    <div class="brand">
      <span class="logo" aria-hidden="true">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round">
          <rect width="18" height="11" x="3" y="11" rx="2" ry="2" />
          <path d="M7 11V7a5 5 0 0 1 10 0v4" />
        </svg>
      </span>
      <div>
        <h1>Document Dash</h1>
        <p>Kiosk login</p>
      </div>
    </div>

    <form id="login-form" novalidate>
      <label for="admin-id">Admin ID</label>
      <input id="admin-id" name="admin-id" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required />

      <label for="admin-password">Password</label>
      <input id="admin-password" name="admin-password" type="password" autocomplete="current-password" required />

      <button type="submit">Log in</button>
      <p id="message" class="message" role="status" aria-live="polite"></p>
    </form>

    <p class="note">Log in once on each kiosk. This device then stays logged in for a year.</p>
  </main>

  <script>
    const form = document.getElementById('login-form');
    const idInput = document.getElementById('admin-id');
    const passwordInput = document.getElementById('admin-password');
    const button = form.querySelector('button');
    const message = document.getElementById('message');

    const show = (text, kind) => {
      message.textContent = text;
      message.className = `message is-${kind}`;
    };

    // The game answers devices that hold the kiosk cookie, and redirects others back here
    const gameOpens = () => fetch('../', { method: 'HEAD', redirect: 'manual', cache: 'no-store' })
      .then(res => res.ok, () => false);

    // Already logged in on this device?
    gameOpens().then(ok => { if (ok) location.replace('../'); });

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const id = idInput.value.trim();
      const password = passwordInput.value;
      if (!id || !password) {
        show('Enter the admin ID and password.', 'error');
        return;
      }

      button.disabled = true;
      show('Checking…', 'info');
      try {
        // nginx checks these against the server's password file and, if right, sets the kiosk cookie
        const bytes = new TextEncoder().encode(`${id}:${password}`);
        const basic = btoa(String.fromCharCode(...bytes));
        const res = await fetch('../__login', {
          headers: { Authorization: `Basic ${basic}` },
          cache: 'no-store',
          credentials: 'same-origin'
        });

        if (res.ok) {
          // The browser can still refuse the cookie (cookies blocked, or a Secure cookie on http://)
          if (await gameOpens()) {
            show('Logged in. Opening the game…', 'success');
            location.replace('../');
          } else {
            show('The password is right, but this browser didn\'t keep the login. Allow cookies for this site. If it opens over http://, the server admin needs to set DEPLOY_COOKIE_SECURE=false and deploy again.', 'error');
          }
          return;
        }
        if (res.status === 401 || res.status === 403) {
          show('Wrong admin ID or password.', 'error');
        } else {
          show(`Login isn't available right now (error ${res.status}). The server admin may need to run "npm run deploy:admin".`, 'error');
        }
      } catch {
        show('Could not reach the server. Check the connection and try again.', 'error');
      } finally {
        button.disabled = false;
        passwordInput.value = '';
      }
    });

    idInput.focus();
  </script>
</body>
</html>
